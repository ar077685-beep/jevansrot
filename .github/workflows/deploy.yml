name: CI/CD FTP Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to InfinityFree FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Next.js Static Export
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔍 Verify Build Output
        run: |
          echo "Listing generated files in out/ directory:"
          ls -la out/
          test -f out/index.html || (echo "Error: index.html not found!" && exit 1)

      - name: 📤 Deploy to FTP (htdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'htdocs/' }}
          local-dir: ./out/
          dangerous-clean-slate: false
          log-level: standard
